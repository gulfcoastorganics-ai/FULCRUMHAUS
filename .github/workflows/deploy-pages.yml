name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public site
        run: |
          set -euo pipefail
          test -s index.html
          test -s project.html
          test -s privacy.html
          test -s app.js
          test -s styles.css
          node --check app.js

      - name: Stage subpath-safe static site
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p _site/project _site/privacy
          cp index.html app.js styles.css _site/
          cp project.html _site/project/index.html
          cp privacy.html _site/privacy/index.html
          cp project.html privacy.html _site/
          cp -R assets demos _site/
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path('_site')
          base = '/' + os.environ['REPOSITORY_NAME'].strip('/')

          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'(?P<attr>href|src)="/(?!/)', rf'\g<attr>="{base}/', text)
              path.write_text(text, encoding='utf-8')
          PY

          test -s _site/index.html
          test -s _site/project/index.html
          test -s _site/privacy/index.html
          grep -q "href=\"/${REPOSITORY_NAME}/project" _site/index.html
          grep -q "src=\"/${REPOSITORY_NAME}/app.js" _site/index.html
          grep -q "href=\"/${REPOSITORY_NAME}/styles.css" _site/project/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
